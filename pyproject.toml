[project]
name = "jet-tagging-datamaker"
version = "0.1.0"
description = "HuggingFace mirror of the hls4ml LHC jet dataset (150 particles)."
authors = [
    {name = "Patrick Odagiu",email = "podagiu@ethz.ch"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy (>=2.0,<3.0)",
    "h5py (>=3.10,<4.0)",
    "pyarrow (>=21,<26)",
    "scikit-learn (>=1.5,<2.0)",
]

[tool.poetry]
packages = [{include = "jet_tagging_datamaker", from = "src"}]

# Optional so that a bare `poetry install` does not pull the loader's own dependencies,
# which the export never needs: they are here to test the code the record ships.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
torch = ">=2.0"
hydra-core = ">=1.3"
omegaconf = ">=2.3"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
